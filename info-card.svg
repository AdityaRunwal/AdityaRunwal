<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .header-bg { fill: #161b22; }
    .header-title { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #8b949e; }
    .term-text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 13px; }
    .user-line { font-weight: bold; fill: #39d353; }
    .separator { fill: #30363d; }
    .key { font-weight: 600; fill: #58a6ff; }
    .value { fill: #c9d1d9; }
    .prompt { fill: #79c0ff; font-style: italic; }
  </style>

  <!-- Background Card -->
  <rect width="500" height="330" rx="10" class="bg"/>

  <!-- Terminal Header Bar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 490 0 A 10 10 0 0 1 500 10 L 500 36 L 0 36 Z" class="header-bg"/>
  <line x1="0" y1="36" x2="500" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="18" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="32" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="46" cy="18" r="5" fill="#27c93f"/>

  <text x="250" y="22" text-anchor="middle" class="header-title">aditya@github ~ (neofetch)</text>

  <!-- Info Content -->
  <g class="term-text" transform="translate(30, 68)">
    <!-- Username line -->
    <text y="0" class="user-line">aditya<tspan fill="#8b949e">@</tspan>AdityaRunwal</text>
    <text y="14" class="separator">---------------------------------------------------</text>

    <!-- Details -->
    <text y="42">
      <tspan class="key">Name:</tspan>
      <tspan x="105" class="value">Aditya Runwal</tspan>
    </text>

    <text y="68">
      <tspan class="key">Role:</tspan>
      <tspan x="105" class="value">Aspiring AI/ML Engineer</tspan>
    </text>

    <text y="94">
      <tspan class="key">Focus:</tspan>
      <tspan x="105" class="value">Machine Learning, DSA &amp; AI Projects</tspan>
    </text>

    <text y="120">
      <tspan class="key">Exploring:</tspan>
      <tspan x="105" class="value">Deep Learning, Generative AI &amp; LLMs</tspan>
    </text>

    <text y="146">
      <tspan class="key">Languages:</tspan>
      <tspan x="105" class="value">Python, C++, Java</tspan>
    </text>

    <text y="172">
      <tspan class="key">Tools:</tspan>
      <tspan x="105" class="value">Git and GitHub</tspan>
    </text>

    <!-- Footer Prompt -->
    <text y="215" class="prompt">$ Building the future with AI...</text>
  </g>
</svg>
