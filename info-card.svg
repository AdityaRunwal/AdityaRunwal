<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .header-bg { fill: #161b22; }
    .header-title { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #8b949e; }
    .term-text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 13px; }
    .user-line { font-weight: bold; fill: #39d353; }
    .separator { fill: #30363d; }
    .key { font-weight: 600; fill: #58a6ff; }
    .value { fill: #c9d1d9; }
    .accent { fill: #d2a8ff; }
    .prompt { fill: #79c0ff; font-style: italic; }
    .ascii { fill: #58a6ff; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="620" height="330" rx="10" class="bg"/>

  <!-- Terminal Header -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 610 0 A 10 10 0 0 1 620 10 L 620 40 L 0 40 Z" class="header-bg"/>
  <line x1="0" y1="40" x2="620" y2="40" stroke="#30363d" stroke-width="1"/>

  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="20" r="6" fill="#27c93f"/>

  <text x="310" y="25" text-anchor="middle" class="header-title">aditya@github ~ (neofetch)</text>

  <!-- Left Side ASCII / Icon Art -->
  <g class="term-text ascii" transform="translate(25, 75)">
    <text y="0">   /\_/\   </text>
    <text y="22">  ( o.o )  </text>
    <text y="44">   &gt; ^ &lt;   </text>
    <text y="66" class="accent">  /  AI  \ </text>
    <text y="88" class="accent"> (  / \   )</text>
    <text y="110">  `---'---` </text>
    <text y="140" fill="#2ea043"> [==========]</text>
    <text y="160" fill="#238636">  AI/ML 100% </text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="165" y1="55" x2="165" y2="280" stroke="#21262d" stroke-width="1"/>

  <!-- Info Content -->
  <g class="term-text" transform="translate(185, 75)">
    <!-- Username line -->
    <text y="0" class="user-line">aditya<tspan fill="#8b949e">@</tspan>AdityaRunwal</text>
    <text y="14" class="separator">-----------------------------------------</text>

    <!-- Details -->
    <text y="38">
      <tspan class="key">Name:</tspan>
      <tspan x="110" class="value">Aditya Runwal</tspan>
    </text>

    <text y="63">
      <tspan class="key">Role:</tspan>
      <tspan x="110" class="value">Aspiring AI/ML Engineer</tspan>
    </text>

    <text y="88">
      <tspan class="key">Focus:</tspan>
      <tspan x="110" class="value">Machine Learning, DSA &amp; AI Projects</tspan>
    </text>

    <text y="113">
      <tspan class="key">Exploring:</tspan>
      <tspan x="110" class="value">Deep Learning, Generative AI &amp; LLMs</tspan>
    </text>

    <text y="138">
      <tspan class="key">Languages:</tspan>
      <tspan x="110" class="value">Python, C++, Java</tspan>
    </text>

    <text y="163">
      <tspan class="key">Tools:</tspan>
      <tspan x="110" class="value">Git and GitHub</tspan>
    </text>

    <!-- Footer Quote -->
    <text y="200" class="prompt">$ Building the future with AI...</text>
  </g>
</svg>

